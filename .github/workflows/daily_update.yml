name: Daily News Sentiment Dashboard

on:
  schedule:
    - cron: '0 8 * * *'   # Every day at 8:00 AM UTC
  workflow_dispatch:        # Also allow manual trigger from GitHub UI
  push:
    branches: [ main ]      # Also run on every push

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install textblob vaderSentiment requests pandas numpy
          python -m textblob.download_corpora

      - name: Generate dashboard data
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
        run: python generate_dashboard.py

      - name: Commit updated data
        run: |
          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"
          git add docs/
          git diff --staged --quiet || git commit -m "Auto-update: News sentiment $(date +'%Y-%m-%d %H:%M UTC')"
          git push
